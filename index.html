<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Meds">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💊</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💊</text></svg>">
    <title>Meds</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-left">
                <h1>💊 Meds</h1>
                <div class="date-picker-container">
                    <input type="date" id="datePicker" class="date-picker">
                </div>
            </div>
            <div class="header-actions">
                <button class="action-button" id="addMedButton">Schedule Meds</button>
                <button class="action-button secondary" id="logAsNeededButton">+ As-Needed</button>
            </div>
        </header>

        <!-- Navigation Tabs -->
        <div class="tabs">
            <button class="tab-button active" data-tab="medications">Medications</button>
            <button class="tab-button" data-tab="appointments">Appointments</button>
        </div>

        <!-- Medications Section -->
        <div class="tab-content active" id="medicationsTab">
            <!-- All Medications -->
            <div class="medications-list" id="medicationsList">
                <!-- All medications will be inserted here -->
            </div>
        </div>

        <!-- Appointments Section -->
        <div class="tab-content" id="appointmentsTab">
            <div class="appointments-filter">
                <button class="filter-button active" data-filter="upcoming">Upcoming</button>
                <button class="filter-button" data-filter="past">Past</button>
            </div>

            <div class="appointments-list" id="appointmentsList">
                <!-- Appointments will be inserted here -->
            </div>

            <button class="add-button" id="addApptButton">+ Add Appointment</button>
        </div>
    </div>

    <!-- Modal for adding/editing medications -->
    <div class="modal" id="medModal">
        <div class="modal-content">
            <h2 id="medModalTitle">Add Medication</h2>
            <form id="medForm">
                <div class="form-group">
                    <label for="medName">Medication Name</label>
                    <input type="text" id="medName" required>
                </div>

                <div class="form-group">
                    <label for="medDosage">Dosage (e.g., "1 pill", "2 tablets")</label>
                    <input type="text" id="medDosage" required>
                </div>

                <div class="form-group">
                    <label>Time of Day (select all that apply)</label>
                    <div class="times-selector">
                        <label class="time-checkbox">
                            <input type="checkbox" name="medTimes" value="Morning">
                            <span>Morning</span>
                        </label>
                        <label class="time-checkbox">
                            <input type="checkbox" name="medTimes" value="Afternoon">
                            <span>Afternoon</span>
                        </label>
                        <label class="time-checkbox">
                            <input type="checkbox" name="medTimes" value="Evening">
                            <span>Evening</span>
                        </label>
                        <label class="time-checkbox">
                            <input type="checkbox" name="medTimes" value="Bedtime">
                            <span>Bedtime</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="medFrequency">How Often?</label>
                    <select id="medFrequency" required>
                        <option value="daily">Every Day</option>
                        <option value="every-other-day">Every Other Day</option>
                        <option value="mwf">Monday, Wednesday, Friday</option>
                        <option value="custom-days">Custom Days of Week</option>
                    </select>
                </div>

                <div class="form-group" id="customDaysGroup" style="display: none;">
                    <label>Select Days</label>
                    <div class="days-selector">
                        <label class="day-checkbox">
                            <input type="checkbox" name="medDays" value="0"> Sun
                        </label>
                        <label class="day-checkbox">
                            <input type="checkbox" name="medDays" value="1"> Mon
                        </label>
                        <label class="day-checkbox">
                            <input type="checkbox" name="medDays" value="2"> Tue
                        </label>
                        <label class="day-checkbox">
                            <input type="checkbox" name="medDays" value="3"> Wed
                        </label>
                        <label class="day-checkbox">
                            <input type="checkbox" name="medDays" value="4"> Thu
                        </label>
                        <label class="day-checkbox">
                            <input type="checkbox" name="medDays" value="5"> Fri
                        </label>
                        <label class="day-checkbox">
                            <input type="checkbox" name="medDays" value="6"> Sat
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="medDuration">Duration</label>
                    <select id="medDuration" required>
                        <option value="ongoing">Ongoing (no end date)</option>
                        <option value="weeks">For a number of weeks</option>
                        <option value="months">For a number of months</option>
                        <option value="end-date">Until a specific date</option>
                    </select>
                </div>

                <div class="form-group" id="durationNumberGroup" style="display: none;">
                    <label for="medDurationNumber">Number of <span id="durationUnit">weeks</span></label>
                    <input type="number" id="medDurationNumber" min="1" placeholder="e.g., 4">
                </div>

                <div class="form-group" id="endDateGroup" style="display: none;">
                    <label for="medEndDate">End Date</label>
                    <input type="date" id="medEndDate">
                </div>

                <div class="form-group">
                    <label for="medNotes">Notes (optional)</label>
                    <input type="text" id="medNotes" placeholder="With food, etc.">
                </div>

                <div class="form-buttons">
                    <button type="button" class="cancel-button" id="medCancelButton">Cancel</button>
                    <button type="submit" class="save-button">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal for logging as-needed medication -->
    <div class="modal" id="asNeededModal">
        <div class="modal-content">
            <h2>Log As-Needed Medication</h2>
            <form id="asNeededForm">
                <div class="form-group">
                    <label for="asNeededName">Medication Name</label>
                    <input type="text" id="asNeededName" placeholder="e.g., Norco, Tylenol" required>
                </div>

                <div class="form-group">
                    <label for="asNeededDosage">Dosage</label>
                    <input type="text" id="asNeededDosage" placeholder="e.g., 1 pill, 5mg" required>
                </div>

                <div class="form-group">
                    <label for="asNeededTime">Time Taken</label>
                    <input type="time" id="asNeededTime" required>
                </div>

                <div class="form-group">
                    <label for="asNeededNotes">Notes (optional)</label>
                    <input type="text" id="asNeededNotes" placeholder="Reason: headache, pain, etc.">
                </div>

                <div class="form-buttons">
                    <button type="button" class="cancel-button" id="asNeededCancelButton">Cancel</button>
                    <button type="submit" class="save-button">Log Medication</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal for adding/editing appointments -->
    <div class="modal" id="apptModal">
        <div class="modal-content">
            <h2 id="apptModalTitle">Add Appointment</h2>
            <form id="apptForm">
                <div class="form-group">
                    <label for="apptType">Type</label>
                    <select id="apptType" required>
                        <option value="Doctor Visit">Doctor Visit</option>
                        <option value="Infusion">Infusion</option>
                        <option value="Lab Work">Lab Work</option>
                        <option value="Procedure">Procedure</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="apptTitle">Title/Description</label>
                    <input type="text" id="apptTitle" placeholder="e.g., Dr. Smith Check-up" required>
                </div>

                <div class="form-group">
                    <label for="apptDate">Date</label>
                    <input type="date" id="apptDate" required>
                </div>

                <div class="form-group">
                    <label for="apptTime">Time</label>
                    <input type="time" id="apptTime" required>
                </div>

                <div class="form-group">
                    <label for="apptLocation">Location</label>
                    <select id="apptLocation" required>
                        <option value="Virtual">Virtual (Video Call)</option>
                        <option value="In-Person">In-Person</option>
                    </select>
                </div>

                <div class="form-group" id="apptAddressGroup">
                    <label for="apptAddress">Address/Details</label>
                    <input type="text" id="apptAddress" placeholder="Hospital name, room number, or video link">
                </div>

                <div class="form-group">
                    <label for="apptNotes">Notes (optional)</label>
                    <textarea id="apptNotes" rows="3" placeholder="Bring insurance card, fasting required, etc."></textarea>
                </div>

                <div class="form-buttons">
                    <button type="button" class="cancel-button" id="apptCancelButton">Cancel</button>
                    <button type="submit" class="save-button">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
